# OpsWeave — full stack
#
# Ports（host → container）:
#   frontend : 8501 → 8501  (React UI — start here)
#   backend  : 8000 → 8000  (FastAPI — http://localhost:8000/docs)
#   postgres : 5432 → 5432  (Postgres 16 + pgvector)
#   redis    : 6379 → 6379  (Redis)
#   ollama   : 11434 → 11434 (local LLM server)
#
# Persistence: postgres_data and redis_data named volumes survive compose restarts.
# Service hostnames inside the compose network: postgres / redis / ollama / backend / frontend.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opsweave_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsweave}
      POSTGRES_USER: ${POSTGRES_USER:-opsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsuser} -d ${POSTGRES_DB:-opsweave}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opsweave_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: opsweave_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 第二階段 reranker（HF text-embeddings-inference 提供 bge-reranker-v2-m3）。
  # 僅在 RERANKER_ENABLED=true 時被後端使用；首次啟動會下載模型（~2GB）到 reranker_data。
  # GPU 環境可改用 ghcr.io/huggingface/text-embeddings-inference:1.5（CUDA）以降低延遲。
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: opsweave_reranker
    restart: unless-stopped
    # CPU-only：縮小 warmup batch 避免 16384 預設值在 CPU 上 warmup 撐爆/卡死；
    # auto-truncate 讓過長輸入截斷而非報錯。
    command:
      - "--model-id"
      - "BAAI/bge-reranker-v2-m3"
      - "--max-batch-tokens"
      - "2048"
      - "--max-client-batch-size"
      - "32"
      - "--auto-truncate"
    ports:
      - "8080:80"
    volumes:
      - reranker_data:/data

  backend:
    build: ./backend
    container_name: opsweave_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    # compose network 內以 service 名互連，覆蓋 .env 預設的 localhost
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      # Inside Docker, use the compose service hostname for the bundled Ollama.
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://ollama:11434}
      # Inside Docker, point the backend at the bundled reranker service.
      RERANKER_BASE_URL: ${DOCKER_RERANKER_BASE_URL:-http://reranker:80}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # 不等 healthy：TEI CPU image 無 curl 難做 healthcheck，且後端對 reranker 缺席有 fallback。
      reranker:
        condition: service_started
    volumes:
      - ./backend:/app
    # 啟動先跑 Alembic migrations 到 head（versioned schema，非 create_all），再起 API。
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health',timeout=2)\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: opsweave_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    # 以 Vite dev server（含 HMR）執行，改前端原始碼即時反映、不需重 build dist
    command: npm run dev
    # frontend 沒有 healthcheck 需求；它本身就是給人按的 UI
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      # 匿名 volume 保留容器內自身的 node_modules（正確的原生 binding），避免被 host 覆蓋
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  reranker_data:
